[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mplayer-adaptive"
version = "0.1.0"
description = "Lightweight Linux mpv player with adaptive scaling"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.4"]

[project.scripts]
mplayer-adaptive = "mplayer.app:main"

[tool.setuptools.packages.find]
include = ["mplayer*"]
